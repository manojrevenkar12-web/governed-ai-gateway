name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily: the evaluation and the audit-chain check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: aigw_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    env:
      AIGW_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/aigw_test
      AIGW_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  evaluate:
    name: evaluation and service-level objectives
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: aigw}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    env:
      AIGW_DATABASE_URL: postgresql://postgres@localhost:5432/aigw
      AIGW_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Evaluate (data protection, load, failover, budgets, a simulated month)
        run: aigw evaluate --quick
      - name: Gate on the service-level objectives
        run: aigw gate
      - name: Verify the audit chain
        run: aigw audit-verify
      - run: cat reports/EVALUATION.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: reports, path: reports/, retention-days: 30}

  container:
    name: container and smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose -f deploy/docker-compose.yml up --build -d
      - name: Smoke test (redaction, blocking, metrics)
        run: deploy/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - run: docker compose -f deploy/docker-compose.yml down -v
