# Local stack: gateway + PostgreSQL + Redis, with mock models (no API keys needed).
#   docker compose -f deploy/docker-compose.yml up --build
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: aigw, POSTGRES_HOST_AUTH_METHOD: trust}
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 30}
  redis:
    image: redis:7
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30}
  gateway:
    build: {context: .., dockerfile: deploy/Dockerfile}
    environment:
      AIGW_DATABASE_URL: postgresql://postgres@postgres:5432/aigw
      AIGW_REDIS_URL: redis://redis:6379/0
      AIGW_POLICY_FILE: /app/policies/demo.yaml
      AIGW_ADMIN_TOKEN: ${AIGW_ADMIN_TOKEN:-change-me}
      AIGW_REPLICAS: "1"
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
